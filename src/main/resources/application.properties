# ============================================
# Aplicacion
# ============================================
spring.application.name=prueba-tecnica-java
# Puerto: el entorno (Azure, Docker) puede inyectar PORT. Por defecto 8080 en local.
server.port=${PORT:8080}

# ============================================
# Base de datos H2 en memoria
# Elegida para que el evaluador no tenga que instalar BD externa.
# La consola web permite inspeccionar el estado durante pruebas manuales.
# ============================================
spring.datasource.url=jdbc:h2:mem:alquileresdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (solo dev): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# JPA / Hibernate
# create-drop: la BD se reconstruye en cada arranque (apto para H2 en memoria).
# show-sql=true: util para verificar consultas en la consola durante desarrollo.
# ============================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================
# Seguridad por API Key
# La clave por defecto puede sobreescribirse con la variable de entorno API_KEY.
# En produccion NUNCA deberia estar hardcodeada; aqui se hace por simplicidad de evaluacion.
# ============================================
app.security.api-key=${API_KEY:dev-api-key-cambiar-en-produccion}
app.security.api-key-header=X-API-KEY

# ============================================
# OpenAPI / Swagger UI
# UI: http://localhost:8080/swagger-ui.html
# Spec JSON: http://localhost:8080/v3/api-docs
# ============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ============================================
# Logging
# ============================================
logging.level.com.luisdavid.pruebatecnica=DEBUG
logging.level.org.springframework.security=INFO
