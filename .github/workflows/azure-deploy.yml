name: Build & push imagen a GHCR

# Construye la imagen Docker y la sube a GitHub Container Registry (GHCR)
# en cada push a main. El despliegue a Azure Container Apps se hace despues
# corriendo el script ./deploy.ps1 desde local (ver DEPLOYMENT.md).
#
# Por que no hacemos tambien el deploy a Azure desde aqui:
# La cuenta de Azure for Students de la universidad no permite crear Service
# Principals (necesarios para OIDC). Si en un futuro el admin del tenant
# habilita ese permiso, el workflow se puede extender facilmente con
# 'azure/login@v2' + 'azure/container-apps-deploy-action@v2'.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write       # para pushear a GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          echo "Imagen publicada en: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Para desplegar a Azure, corre desde local:"
          echo "  ./deploy.ps1"
